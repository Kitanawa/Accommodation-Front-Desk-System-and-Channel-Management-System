  /api/public/payments/webhook:
    post:
      tags:
        - Booking engine
      summary: "S171, S172, S173: result of a payment from the gateway. The raw body is signed with HMAC-SHA256 (hex) and a shared secret (env PAYMENT_WEBHOOK_SECRET) in header X-Signature. The reference, amount and currency must match the session. Each event_id is processed once (a repeat answers DUPLICATE). A success confirms the booking; a failure releases the hold; a success after the hold ended takes the room again if it is free, otherwise the booking becomes PAID_UNFULFILLED and the managers are told. The gateway message format is an assumption: the client has not named a gateway."
      description: "Who: Public. Status: implemented."
      operationId: POST_api_public_payments_webhook
      x-status: implemented
      parameters:
        - name: X-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 (hex) of the raw body.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: INVALID_SIGNATURE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Error code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Error code: PAYMENT_MISMATCH"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                type:
                  type: string
                  enum:
                    - payment.succeeded
                    - payment.failed
                reference:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
                transaction_id:
                  type: string
              required:
                - event_id
                - type
                - reference
