openapi: 3.0.3
info:
  title: FDS Backend API
  version: 0.5.0
  description: Accommodation Front Desk System, SRS Draft 2. Contract for S055. Endpoints with an x-status other than implemented are defined now and built in that subtask.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
tags:
  - name: Sign in
  - name: Sessions
  - name: Reference data
  - name: Room types
  - name: Room categories
  - name: Reservations
  - name: Stay
  - name: Folio
  - name: Rooms
  - name: Rates
  - name: Add-ons
  - name: Audit
  - name: Staff accounts
  - name: Web app (apps/fds-web)
paths:
  /api/login:
    post:
      tags:
        - Sign in
      summary: Sign in with email and password. Returns a session token.
      description: "Who: Public. Status: implemented."
      operationId: POST_api_login
      x-status: implemented
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: INVALID_CREDENTIALS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Error code: ACCOUNT_DISABLED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Error code: ACCOUNT_LOCKED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
  /api/logout:
    post:
      tags:
        - Sign in
      summary: End the current session.
      description: "Who: Any signed-in user. Status: implemented."
      operationId: POST_api_logout
      x-status: implemented
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/me:
    get:
      tags:
        - Sign in
      summary: The signed-in user.
      description: "Who: Any signed-in user. Status: implemented."
      operationId: GET_api_me
      x-status: implemented
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/info:
    get:
      tags:
        - Sign in
      summary: Which database the server is using.
      description: "Who: Public. Status: implemented."
      operationId: GET_api_info
      x-status: implemented
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  database:
                    type: string
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /api/sessions:
    get:
      tags:
        - Sessions
      summary: My active sessions (the current one is marked).
      description: "Who: Any signed-in user. Status: implemented."
      operationId: GET_api_sessions
      x-status: implemented
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}:
    delete:
      tags:
        - Sessions
      summary: End one of my sessions.
      description: "Who: Any signed-in user. Status: implemented."
      operationId: DELETE_api_sessions_id
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Error code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/revoke-others:
    post:
      tags:
        - Sessions
      summary: End all my sessions except this one.
      description: "Who: Any signed-in user. Status: implemented."
      operationId: POST_api_sessions_revoke_others
      x-status: implemented
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revoked"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sources:
    get:
      tags:
        - Reference data
      summary: Booking sources (Walk-in, Phone, Email, Website, Travel agent, OTA).
      description: "Who: Any signed-in user. Status: implemented."
      operationId: GET_api_sources
      x-status: implemented
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/room-types:
    get:
      tags:
        - Room types
      summary: Room types of my property. Front Desk sees APPROVED types only; Administrator and Manager also see PENDING ones.
      description: "Who: All roles. Status: implemented."
      operationId: GET_api_room_types
      x-status: implemented
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomType"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Room types
      summary: "S067: submit a room type together with its rates. Everything starts PENDING; the type cannot be sold until approved."
      description: "Who: Administrator, Manager. Status: implemented."
      operationId: POST_api_room_types
      x-status: implemented
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomTypeSubmitted"
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Error code: FORBIDDEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Error code: CONFLICT"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: string
                  format: uuid
                name:
                  type: string
                max_guests:
                  type: integer
                min_nights:
                  type: integer
                description:
                  type: string
                facilities:
                  type: array
                  items:
                    type: string
                photos:
                  type: array
                  items:
                    $ref: "#/components/schemas/Photo"
                layout_info:
                  type: string
                rates:
                  type: array
                  items:
                    $ref: "#/components/schemas/RateInput"
              required:
                - category_id
                - name
                - max_guests
  /api/room-types/{id}:
    get:
      tags:
        - Room types
      summary: One room type with its rates and rooms (Front Desk sees approved rates only).
      description: "Who: All roles. Status: implemented."
      operationId: GET_api_room_types_id
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomTypeDetail"
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Error code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - Room types
      summary: Change room type details. Details take effect at once; only rates need approval.
      description: "Who: Administrator, Manager. Status: implemented."
      operationId: PATCH_api_room_types_id
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Error code: FORBIDDEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Error code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Error code: CONFLICT"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: string
                  format: uuid
                name:
                  type: string
                max_guests:
                  type: integer
                min_nights:
                  type: integer
                description:
                  type: string
                facilities:
                  type: array
                  items:
                    type: string
                photos:
                  type: array
                  items:
                    $ref: "#/components/schemas/Photo"
                layout_info:
                  type: string
    delete:
      tags:
        - Room types
      summary: Withdraw a room type that is still PENDING and has no reservations (its rates and rooms go with it).
      description: "Who: Administrator, Manager. Status: implemented."
      operationId: DELETE_api_room_types_id
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Error code: FORBIDDEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Error code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Error code: INVALID_STATE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/room-types/{id}/approve:
    post:
      tags:
        - Room types
      summary: "S067: approve a PENDING room type and its pending rates in one step. Needs a pending Base Rate."
      description: "Who: Administrator; Manager only if can_approve_rates. Status: implemented."
      operationId: POST_api_room_types_id_approve
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomTypeApproved"
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Error code: FORBIDDEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Error code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Error code: INVALID_STATE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/room-categories:
    get:
      tags:
        - Room categories
      summary: Room categories with the number of room types in each.
      description: "Who: All roles. Status: implemented."
      operationId: GET_api_room_categories
      x-status: implemented
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomCategory"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Room categories
      summary: "S060: create a room category. The name must be unique ignoring upper/lower case."
      description: "Who: Administrator, Manager. Status: implemented."
      operationId: POST_api_room_categories
      x-status: implemented
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomCategory"
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Error code: FORBIDDEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Error code: CONFLICT"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
  /api/room-categories/{id}:
    patch:
      tags:
        - Room categories
      summary: Rename a room category.
      description: "Who: Administrator, Manager. Status: implemented."
      operationId: PATCH_api_room_categories_id
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  database:
                    type: string
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Error code: FORBIDDEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Error code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Error code: CONFLICT"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
    delete:
      tags:
        - Room categories
      summary: Delete an empty room category.
      description: "Who: Administrator, Manager. Status: implemented."
      operationId: DELETE_api_room_categories_id
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Error code: FORBIDDEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Error code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Error code: INVALID_STATE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/dashboard:
    get:
      tags:
        - Reference data
      summary: Today's arrivals and departures, in-house count, room occupancy and pending rates (pending_rates is null for Front Desk).
      description: "Who: All roles. Status: implemented."
      operationId: GET_api_dashboard
      x-status: implemented
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/availability:
    get:
      tags:
        - Reservations
      summary: Rooms left, nightly rates and total for a stay, per room type.
      description: "Who: All roles. Status: implemented."
      operationId: GET_api_availability
      x-status: implemented
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Check-in, not in the past.
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Check-out, after from.
        - name: guests
          in: query
          required: false
          schema:
            type: integer
          description: Default 1.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityItem"
        "400":
          description: "Error code: VALIDATION_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error code: SESSION_EXPIRED or SESSION_REVOKED or UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Error code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/calendar:
    get:
      tags:
        - Reservations
      summary: "Read-only room calendar for the Booking page: for each approved room type and each night, rooms left, total rooms and the nightly rate."
      description: "Who: All roles. Status: implemented."
      operationId: GET_api_calendar
      x-status: implemented
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          description: First night shown.
        - name: days
          in: query
          required: false
          schema:
