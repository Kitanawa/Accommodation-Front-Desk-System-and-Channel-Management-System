                - INTERNAL_ERROR
            message:
              type: string
            request_id:
              type: string
              format: uuid
            fields:
              type: array
              description: Present for VALIDATION_ERROR and some conflicts.
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
